version: '3'

services:
  plugins:
    build:
      context: ./wp-react-blocks-plugin/
    volumes:
      - ./wp-react-blocks-plugin/blocks/build:/tmp/plugins
    restart: "no"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1026:1025"  # SMTP port
      - "8025:8025"  # Web interface port
    networks:
      - frontend 

  wordpress:
    image: library/wordpress:php8.4-fpm-alpine
    depends_on:
      - plugins
      - mysql
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_SMTP_HOST: mailhog
      WORDPRESS_SMTP_PORT: 1026
      # specific PHP 8.4 settings
      PHP_MEMORY_LIMIT: 256M
      PHP_MAX_EXECUTION_TIME: 300
      PHP_UPLOAD_MAX_FILESIZE: 64M
      PHP_POST_MAX_SIZE: 64M
    volumes:
      - ./data/wordpress:/var/www/html
      - ./wp-theme:/var/www/html/wp-content/themes/wp-react-theme
      - ./wp-react-blocks-plugin:/var/www/html/wp-content/plugins/wp-react-blocks-plugin
      - ./wp-content:/var/www/html/wp-content
    networks:
      - frontend  #for dev purpose we use a bridged network
    ports:
      - 9090:80

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/wordpress_dev.conf:/etc/nginx/conf.d/wordpress.conf:ro
      - ./data/wordpress:/var/www/html:ro
      - ./wp-react-blocks-plugin:/var/www/html/wp-content/plugins/wp-react-blocks-plugin
      - ./wp-content:/var/www/html/wp-content
      - ./wp-theme:/var/www/html/wp-content/themes/wp-react-theme
      -  ui:/var/www/ui:ro
    depends_on:
      - wordpress
    networks:
      - frontend
    ports:
      - 80:8082

  mysql:
    image: mariadb
    volumes:
      - ./data/mysql:/var/lib/mysql
    restart: always
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: somewordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    networks:
      - frontend #for dev purpose we use a bridged network
  
networks:
  frontend:
    driver: bridge

volumes:
  ui: